# AcademicManager Vulnerable — HTTP uniquement (laboratoire)
# ⚠️ À n'utiliser que dans un environnement isolé, jamais en production.

server {
    listen 8080;
    server_name vulnerable.local;

    # Restriction réseau : uniquement le sous-réseau du laboratoire
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    deny all;

    access_log /var/log/nginx/academic_vulnerable_access.log;
    error_log  /var/log/nginx/academic_vulnerable_error.log;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ⚠️ Aucun header de sécurité ajouté — mission 1.1
    }

    location /static/ {
        alias /opt/academic_vulnerable/static/;
        expires 1h;
    }
}
# AcademicManager Secure — HTTPS + HSTS + headers (Mission 1.1, 1.2)
# Redirection HTTP -> HTTPS + TLS 1.2/1.3 uniquement.

server {
    listen 80;
    server_name secure.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name secure.local;

    # Certificat de laboratoire (auto-signé ou Let's Encrypt)
    ssl_certificate     /etc/nginx/ssl/secure.local.crt;
    ssl_certificate_key /etc/nginx/ssl/secure.local.key;

    # TLS 1.2 + 1.3 uniquement
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/academic_secure_access.log;
    error_log  /var/log/nginx/academic_secure_error.log;

    # 🔐 En-têtes de sécurité (en complément de ceux posés par Flask)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Limites de sécurité
        client_max_body_size 5m;
        proxy_read_timeout 30s;
    }

    location /static/ {
        alias /opt/academic_secure/static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
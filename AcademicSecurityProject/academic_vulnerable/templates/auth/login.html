{% extends "base.html" %}
{% block title %}Connexion — AcademicManager{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-mortarboard-fill"></i>
            <h1>AcademicManager</h1>
            <p>Plateforme de gestion académique</p>
        </div>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Se connecter
            </button>
        </form>
        <div class="login-hint">
            <small>Comptes de démonstration :</small>
            <small><code>admin</code> / <code>Admin@2025!</code></small>
            <small><code>student1</code> / <code>Student@2025!1</code></small>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Réinitialisation du mot de passe{% endblock %}
{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-shield-lock"></i>
            <h1>Réinitialisation</h1>
            <p>Mécanisme de démonstration local</p>
        </div>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Nom d'utilisateur ou email</label>
                <input type="text" name="identifier" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100">Demander la réinitialisation</button>
        </form>
        <div class="alert alert-info mt-3 small">
            <i class="bi bi-info-circle"></i>
            En laboratoire, un jeton de démonstration est affiché à l'écran
            (pas d'envoi d'email réel).
        </div>
        <div class="login-hint">
            <small><a href="{{ url_for('auth.login') }}">Retour à la connexion</a></small>
        </div>
    </div>
</div>
{% endblock %}

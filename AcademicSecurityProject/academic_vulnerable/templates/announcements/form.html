{% extends "base.html" %}
{% block title %}Nouvelle annonce{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-megaphone"></i> Nouvelle annonce</h2>
</div>
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Titre</label>
                <input type="text" name="title" class="form-control" required maxlength="200">
            </div>
            <div class="mb-3">
                <label class="form-label">Contenu</label>
                <textarea name="content" rows="6" class="form-control" required></textarea>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check"></i> Publier</button>
            <a href="{{ url_for('announcements.index') }}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}

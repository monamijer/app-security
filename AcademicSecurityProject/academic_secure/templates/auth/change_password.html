{% extends "base.html" %}
{% block title %}Changer mon mot de passe{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-key"></i> Changer mon mot de passe</h2>
</div>
<div class="card" style="max-width: 560px;">
    <div class="card-body">
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Mot de passe actuel</label>
                <input type="password" name="old_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nouveau mot de passe</label>
                <input type="password" name="new_password" class="form-control" required minlength="10">
                <small class="text-muted">
                    Minimum 10 caractères, avec majuscule, minuscule, chiffre et caractère spécial.
                </small>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check"></i> Enregistrer</button>
            <a href="{{ url_for('auth.profile') }}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Facultés{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between">
    <h2><i class="bi bi-building"></i> Facultés</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newFacultyModal">
        <i class="bi bi-plus"></i> Nouvelle faculté
    </button>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr><th>Code</th><th>Nom</th><th>Doyen</th><th>Départements</th></tr></thead>
            <tbody>
            {% for f in faculties %}
                <tr>
                    <td><strong>{{ f.code }}</strong></td>
                    <td>{{ f.name }}</td>
                    <td>{{ f.dean_name or '—' }}</td>
                    <td>{{ f.departments.count() }}</td>
                </tr>
            {% else %}
                <tr><td colspan="4" class="text-center text-muted py-4">Aucune faculté.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="newFacultyModal" tabindex="-1">
    <div class="modal-dialog">
        <form method="post" action="{{ url_for('admin.create_faculty') }}" class="modal-content">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="modal-header">
                <h5 class="modal-title">Nouvelle faculté</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Code</label>
                        <input type="text" name="code" class="form-control" required maxlength="20">
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Doyen</label>
                    <input type="text" name="dean_name" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" rows="2" class="form-control"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button class="btn btn-primary">Créer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

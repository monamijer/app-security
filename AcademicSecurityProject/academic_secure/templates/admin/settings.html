{% extends "base.html" %}
{% block title %}Paramètres{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-gear"></i> Paramètres de l'université</h2>
</div>
<div class="card">
    <div class="card-body">
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nom de l'université</label>
                    <input type="text" name="university_name" class="form-control"
                           value="Université de Démonstration" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email de contact</label>
                    <input type="email" name="contact_email" class="form-control"
                           value="contact@univ.local">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Année académique courante</label>
                    <input type="text" name="current_year" class="form-control"
                           value="2025-2026">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Langue par défaut</label>
                    <select name="default_language" class="form-select">
                        <option value="fr" selected>Français</option>
                        <option value="en">Anglais</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Message d'accueil</label>
                    <textarea name="welcome_message" rows="3" class="form-control">
Bienvenue sur la plateforme de gestion académique.</textarea>
                </div>
            </div>
            <div class="mt-3">
                <button class="btn btn-primary"><i class="bi bi-check"></i> Enregistrer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Téléverser un document{% endblock %}
{% block content %}
<div class="page-header"><h2><i class="bi bi-cloud-upload"></i> Téléverser un document</h2></div>
<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Titre</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Fichier</label>
                <input type="file" name="file" class="form-control" required>
                <small class="text-muted">Formats acceptés : PNG, JPG, PDF (max 5 Mo)</small>
            </div>
            <button class="btn btn-primary"><i class="bi bi-check"></i> Envoyer</button>
            <a href="{{ url_for('documents.index') }}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
